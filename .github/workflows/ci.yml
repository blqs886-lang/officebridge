name: Test and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    name: Node 24 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Test engine, privacy boundaries and command-line behavior
        run: npm test
      - name: Build web application
        run: npm run build
      - name: Build portable application
        run: npm run build:portable
      - name: Exercise the offline app in the desktop browser
        if: runner.os == 'macOS' || runner.os == 'Windows'
        shell: bash
        env:
          BROWSER_CHANNEL: ${{ runner.os == 'Windows' && 'msedge' || 'chrome' }}
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-check" --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.62.1
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser-check/node_modules/playwright-core/index.mjs" \
          APP_URL="$(node -p "require('node:url').pathToFileURL(require('node:path').resolve('release/OfficeBridge.html')).href")" \
          npm run test:browser
      - name: Install independent office reader and PDF tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -q update
          sudo apt-get -yq install --no-install-recommends libreoffice-calc libreoffice-impress poppler-utils fonts-noto-cjk
      - name: Prepare pinned Windows office reader and PDF tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'office-reader.msi'
          $archive = Join-Path $env:RUNNER_TEMP 'pdf-tools.zip'
          $pdfTools = Join-Path $env:RUNNER_TEMP 'pdf-tools'
          curl.exe -fsSL --retry 2 'https://download.documentfoundation.org/libreoffice/stable/26.8.2/win/x86_64/LibreOffice_26.8.2_Win_x86-64.msi' -o $installer
          if ($LASTEXITCODE -ne 0) {
            curl.exe -fsSL --retry 2 'https://downloadarchive.documentfoundation.org/libreoffice/old/26.8.2.2/win/x86_64/LibreOffice_26.8.2.2_Win_x86-64.msi' -o $installer
          }
          if ((Get-FileHash $installer).Hash -ne 'FF4B911403B67EE9E6249F820F9782C44BB32C94FDAA45B0DA53A8E419E5307A') { throw 'Office reader checksum mismatch' }
          curl.exe -fsSL --retry 2 'https://github.com/oschwartz10612/poppler-windows/releases/download/v26.09.0-0/Release-26.09.0-0.zip' -o $archive
          if ((Get-FileHash $archive).Hash -ne '7A6F256A0DDF7536182246A5733331BF4677CBCC34F4663774947AD34556C8D0') { throw 'PDF tools checksum mismatch' }
          $install = Start-Process msiexec -ArgumentList "/i `"$installer`" /qn /norestart" -Wait -PassThru
          if ($install.ExitCode -notin 0,3010) { throw "Office reader installation failed: $($install.ExitCode)" }
          Join-Path $env:ProgramFiles 'LibreOffice\program' >> $env:GITHUB_PATH
          Expand-Archive -Path $archive -DestinationPath $pdfTools
          (Get-ChildItem $pdfTools -Recurse -Filter pdftoppm.exe | Select-Object -First 1).DirectoryName >> $env:GITHUB_PATH
      - name: Open, recalculate and render original and repaired synthetic files
        if: runner.os != 'macOS'
        run: python scripts/test-libreoffice.py --with-apple-fixtures
      - name: Parse optional Windows checker using Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw 'This syntax check must use Windows PowerShell 5.1.'
          }
          $script = (Resolve-Path '.\scripts\verify-windows.ps1').Path
          $bytes = [IO.File]::ReadAllBytes($script)
          if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
            throw 'Preserve the UTF-8 BOM so Windows PowerShell 5.1 reads Chinese messages correctly.'
          }
          $tokens = $null
          $parseErrors = $null
          [void][Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List
            throw 'Windows checker syntax validation failed.'
          }
          Write-Host 'Syntax only: Office was not started; no Windows Office compatibility result is claimed.'
      # Deliberately no publish step and no artifact upload. In particular,
      # work/ may contain private local documents and must never be uploaded.
